<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jackson Edwards">
    <meta name="description" content="A character card that can update health and level information.">
    <title>Character Card</title>
    <link rel="stylesheet" href="character.css">
    <script src="character.js" defer></script>
</head>
<body>

    <div class="card">

        <img src="/images/snortleblat.webp" alt="snortleblat character" class="image">

        <h1 class="name">snortleblat</h1>

        <div class="stats">
            <p>Class: Swamp Beast Diplomat</p>
            <p>Level: 1</p>
            <p>Health: 100</p>
        </div>

        <div class="buttons">
            <button class="buttons">Attacked</button>
            
            <button class="buttons">Level Up</button>
        </div>

    </div>
    
</body>
</html>
